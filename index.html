<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:;">
<title>小克</title>
<style>
/* 透明全屏覆盖层：只有她的轮廓和面板接鼠标。白底橙色点缀。 */
[hidden]{display:none!important}
:root{
  --ink:#4a2a22; --muted:#9a7062; --orange:#f2762f; --orange-deep:#d65a1a; --orange-soft:#ffc196;
  --card:#ffffff; --soft:#fff4ec; --line:#f1dccf; --shadow:rgba(110,55,25,.22); --crack:rgba(60,40,40,.62); --rain:#3d7fc4;
  --font:"YouYuan","幼圆","Microsoft YaHei UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  color-scheme:light;
}
html,body{margin:0; height:100%; background:transparent; overflow:hidden; font-family:var(--font); color:var(--ink); user-select:none}
button{font-family:inherit}

#pet{position:fixed; height:var(--h,440px); aspect-ratio:var(--ar,1); touch-action:none; z-index:5; outline:none; opacity:0; transition:opacity .25s}
#pet.ready{opacity:1}
#pet.grab{cursor:grab}
#pet.dragging{cursor:grabbing}
#pet .stage{position:absolute; inset:0; transform-origin:50% 99%}
#pet .sq{position:absolute; inset:0; transform-origin:50% 99%; will-change:transform}
#pet .frames, #pet svg{position:absolute; inset:0; width:100%; height:100%; transform-origin:50% 99%}
#pet .frames canvas{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
#pet.flip .frames,#pet.flip svg{transform:scaleX(-1)}
#pet svg{overflow:visible; pointer-events:none; will-change:transform}
.ground{position:absolute; left:50%; bottom:.6%; width:26%; height:2.6%; margin-left:-13%; border-radius:50%; background:radial-gradient(closest-side, rgba(90,45,20,.22), transparent); transition:opacity .2s}
#pet[data-mode="fly"] .ground,#pet[data-mode="drag"] .ground{opacity:0}

/* 叠加层（表情小件）*/
.ov{display:none}
#pet[data-blush="on"] .ov-blush{display:inline}
#pet[data-x~="anger"] .ov-anger,#pet[data-x~="sweat"] .ov-sweat,#pet[data-x~="tears"] .ov-tears,#pet[data-x~="stars"] .ov-stars,
#pet[data-x~="fire"] .ov-fire,#pet[data-x~="stain"] .ov-stain,#pet[data-x~="steam"] .ov-steam,#pet[data-x~="shuttle"] .ov-shuttle,
#pet[data-x~="snot"] .ov-snot,#pet[data-x~="spicy"] .ov-spicy{display:inline}
.ov-anger g{transform-box:fill-box; transform-origin:center; animation:throb .5s ease-in-out infinite alternate}
@keyframes throb{to{transform:scale(1.25)}}
.ov-tears path{animation:tear 1.1s ease-in infinite}
.ov-tears path:nth-child(2){animation-delay:.5s}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(46px);opacity:0}}
.ov-stars{transform-box:fill-box; transform-origin:center; animation:orbit 1.1s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
.ov-fire text{animation:fire .5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:center bottom}
@keyframes fire{to{transform:translateY(-10px) scale(1.15)}}
.steam{animation:steam 2.4s ease-out infinite; opacity:0}
.steam:nth-of-type(2){animation-delay:.8s}.steam:nth-of-type(3){animation-delay:1.6s}
@keyframes steam{0%{transform:translateY(8px);opacity:0}30%{opacity:.85}100%{transform:translateY(-70px);opacity:0}}
#shuttle{transform-box:fill-box; transform-origin:center; animation:shuttle 1.6s infinite}
@keyframes shuttle{0%{transform:translate(0,0) rotate(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}
  50%{transform:translate(-70px,-340px) rotate(200deg);animation-timing-function:cubic-bezier(.6,0,.8,.4)}
  100%{transform:translate(0,0) rotate(360deg)}}
.snot{transform-box:fill-box; transform-origin:0 50%; animation:snot 3s ease-in-out infinite}
@keyframes snot{0%{transform:scale(.2)}80%{transform:scale(1.3);opacity:.85}84%{transform:scale(1.5);opacity:0}100%{transform:scale(.2);opacity:0}}
.ov-stain circle,.ov-stain ellipse{animation:stain .4s ease-out both}
@keyframes stain{from{transform:scale(.2);opacity:0}}
.ov-stain *{transform-box:fill-box; transform-origin:center}
.zzz{position:absolute; font-weight:700; color:#9a7062; font-size:calc(var(--h,440px)*.055); display:none; pointer-events:none}
#pet[data-x~="zzz"] .zzz{display:block; animation:zz 2.2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,8px) scale(.8)}50%{opacity:1}100%{opacity:0;transform:translate(14px,-26px) scale(1.15)}}
.think{position:absolute; left:62%; top:22%; width:calc(var(--h,440px)*.10); height:calc(var(--h,440px)*.08); display:none; pointer-events:none}
#pet[data-x~="think"] .think{display:block}
.think i{position:absolute; border-radius:50%; background:#fff; border:2px solid #e9c9b5; animation:thinkp 1.6s ease-in-out infinite}
.think i:nth-child(1){left:0;bottom:0;width:18%;height:22%}.think i:nth-child(2){left:18%;bottom:22%;width:26%;height:32%;animation-delay:.2s}
.think i:nth-child(3){left:40%;bottom:46%;width:60%;height:60%;animation-delay:.4s}
@keyframes thinkp{50%{transform:scale(1.12)}}

/* 一次性小动作由 motion.js 做（形变）；只有发光是滤镜，留在 CSS */
#pet.a-glow .stage{animation:glow 1.4s ease-in-out}
@keyframes glow{50%{filter:drop-shadow(0 0 18px #ffb15e)}}

/* 屏幕特效 */
.fx{position:fixed; pointer-events:none; z-index:6; font-weight:700; font-size:22px; animation:float 1.3s ease-out forwards}
.fx.heart{color:#ff5d84}.fx.note{color:var(--orange)}.fx.star{color:#ffb21e}.fx.big{font-size:70px; animation-duration:1.8s}
@keyframes float{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),-110px) scale(1.1) rotate(var(--r))}}
.word{position:fixed; pointer-events:none; z-index:7; padding:3px 10px; border-radius:999px; font-size:13px; font-weight:700; color:#fff;
  background:var(--c,#f2762f); box-shadow:0 4px 12px var(--shadow); white-space:nowrap; transform:translate(-50%,-50%); animation:word 1.3s ease-out forwards}
@keyframes word{0%{opacity:0; transform:translate(-50%,-30%) scale(.6)}15%{opacity:1; transform:translate(-50%,-60%) scale(1.08)}100%{opacity:0; transform:translate(-50%,-260%) scale(1)}}
.bub{position:fixed; pointer-events:none; z-index:6; border-radius:50%; border:1.5px solid rgba(120,180,230,.75); background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(190,225,255,.25) 60%, rgba(255,190,240,.25)); animation:bubA 3.2s ease-out forwards}
@keyframes bubA{0%{opacity:0; transform:scale(.3)}15%{opacity:1}100%{opacity:0; transform:translate(var(--dx),-160px) scale(1.1)}}
.petal{position:fixed; pointer-events:none; z-index:6; width:9px; height:14px; border-radius:80% 10% 80% 10%; background:linear-gradient(#ffc07a,#f2762f); animation:fall 2.2s ease-in forwards}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),130px) rotate(var(--r))}}
.drop{position:fixed; pointer-events:none; z-index:7; width:9px; height:9px; border-radius:50%; background:#c9772e; animation:drop .6s ease-in forwards}
@keyframes drop{to{transform:translate(var(--dx),var(--dy)) scale(.6); opacity:.2}}
.hole{position:fixed; width:44px; height:44px; margin:-22px 0 0 -22px; pointer-events:none; z-index:4; animation:holeIn .12s ease-out, holeOut .8s ease-in 7s forwards}
.hole svg{width:100%; height:100%}
@keyframes holeIn{from{transform:scale(.3)}}
@keyframes holeOut{to{opacity:0}}
.tracer{position:fixed; height:3px; transform-origin:0 50%; pointer-events:none; z-index:6; border-radius:2px; background:linear-gradient(90deg, rgba(255,214,110,0), #ffd66e 60%, #fff6d2); animation:tracerA .12s linear forwards}
@keyframes tracerA{to{opacity:0}}
.casing{position:fixed; width:4px; height:8px; border-radius:2px; background:linear-gradient(90deg,#b8862e,#ffe08a,#b8862e); pointer-events:none; z-index:7; animation:casing .7s cubic-bezier(.2,.6,.5,1) forwards}
@keyframes casing{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(calc(var(--dx)*.6),-30px) rotate(300deg)}100%{transform:translate(var(--dx),40px) rotate(620deg);opacity:0}}
.puff{position:fixed; pointer-events:none; z-index:7; font-weight:700; color:var(--muted); font-size:16px; animation:float .9s ease-out forwards}
.proj{position:fixed; left:0; top:0; pointer-events:none; z-index:8; will-change:transform}
.bonk{position:fixed; pointer-events:none; z-index:8; font-weight:900; font-size:34px; color:#e2462f; text-shadow:0 2px 0 #fff, 0 0 8px #fff; transform:translate(-50%,-50%); animation:bonk .9s ease-out forwards}
@keyframes bonk{0%{transform:translate(-50%,-50%) scale(.3)}25%{transform:translate(-50%,-50%) scale(1.25)}100%{transform:translate(-50%,-120%) scale(1); opacity:0}}
.bump{position:fixed; pointer-events:none; z-index:7; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:radial-gradient(circle, rgba(255,120,120,.55), rgba(255,120,120,0) 70%); animation:holeOut 1.2s ease-in 1.6s forwards}
.dust{position:fixed; pointer-events:none; z-index:6; width:10px; height:10px; border-radius:50%; background:rgba(190,160,140,.7); animation:dust .7s ease-out forwards}
@keyframes dust{to{transform:translate(var(--dx),var(--dy)) scale(2.2); opacity:0}}
.spark{position:fixed; pointer-events:none; z-index:9; border-radius:50%; will-change:transform,opacity}
.score{position:fixed; z-index:12; min-width:110px; text-align:center; background:rgba(255,255,255,.97); border:1.5px solid rgba(255,179,0,.45); border-radius:14px; box-shadow:0 10px 28px var(--shadow); padding:8px 14px 9px; pointer-events:none; transform:translate(-50%,-100%); animation:scorePop .28s cubic-bezier(.3,1.5,.6,1), holeOut .4s ease-in 1.8s forwards}
.score b{display:block; font-size:24px; color:#ff8f00; font-variant-numeric:tabular-nums}
.score small{font-size:11px; color:var(--muted)}
@keyframes scorePop{from{transform:translate(-50%,-100%) scale(.5); opacity:0}}
.tip{position:fixed; z-index:12; padding:3px 9px; border-radius:8px; background:rgba(255,255,255,.96); border:1px solid var(--line); font-size:12px; color:var(--ink); box-shadow:0 3px 10px var(--shadow); pointer-events:none; white-space:nowrap; animation:pop .12s ease-out}

/* 气泡 */
#bubble{position:fixed; z-index:9; max-width:min(300px, calc(100vw - 32px)); background:var(--card); color:var(--ink); border:2px solid var(--orange-soft); border-radius:20px; padding:10px 14px; font-size:14px; line-height:1.6; box-shadow:0 8px 22px var(--shadow); animation:pop .25s cubic-bezier(.3,1.5,.6,1); white-space:pre-wrap; word-break:break-word}
#bubble::after{content:""; position:absolute; bottom:-9px; left:var(--tail,50%); width:14px; height:14px; margin-left:-7px; background:var(--card); border-right:2px solid var(--orange-soft); border-bottom:2px solid var(--orange-soft); transform:rotate(45deg)}
#bubble.below::after{bottom:auto; top:-9px; transform:rotate(225deg)}
#bubble.mad,#bubble.mad::after{border-color:#ff7a6b}
#bubble.hold,#bubble.hold::after{border-color:#9fc5ea}
#bubble.hold{background:#f6fbff}
#bubble.live::before{content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--orange); margin-right:6px; vertical-align:middle; animation:blinkdot .9s ease-in-out infinite}
@keyframes blinkdot{50%{opacity:.2}}
#bubble .sub{display:block; font-size:11.5px; color:var(--muted); margin-top:2px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* 面板通用 */
.panel{position:fixed; z-index:10; background:var(--card); border:2px solid var(--line); border-radius:18px; box-shadow:0 10px 26px var(--shadow); animation:pop .2s ease-out}
.panel .head{display:flex; align-items:center; gap:8px; padding:10px 12px 6px}
.panel .head b{font-size:14px; color:var(--orange-deep)}
.panel .head .x{all:unset; cursor:pointer; margin-left:auto; width:24px; height:24px; border-radius:50%; display:grid; place-items:center; color:var(--muted); font-size:16px}
.panel .head .x:hover{background:var(--soft)}
.panel .head .sub{font-size:11px; color:var(--muted); margin-left:4px}
.chip{all:unset; cursor:pointer; padding:5px 10px; border-radius:999px; font-size:12.5px; font-weight:700; color:var(--muted); background:var(--soft); border:1.5px solid var(--line)}
.chip[aria-selected="true"],.chip[aria-pressed="true"]{background:var(--orange); color:#fff; border-color:var(--orange)}
.chip:hover{border-color:var(--orange-soft)}
.btn{all:unset; cursor:pointer; background:var(--orange); color:#fff; font-size:12.5px; font-weight:700; padding:6px 12px; border-radius:10px; text-align:center}
.btn:hover,.btn:focus-visible{background:var(--orange-deep)}
.btn.ghost{background:var(--soft); color:var(--ink); border:1.5px solid var(--line)}
.btn.ghost[aria-pressed="true"]{background:#ffe3cf; border-color:var(--orange)}
.btn[disabled]{opacity:.5; cursor:default}

/* 主面板：聊天 / 互动 / 动作 / 设置 */
#menu{width:236px; padding:8px; display:grid; grid-template-columns:1fr 1fr; gap:6px}
#menu button{all:unset; box-sizing:border-box; cursor:pointer; padding:12px 8px; border-radius:14px; text-align:center; background:var(--soft); border:1.5px solid var(--line); font-size:14px; font-weight:700; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:3px}
#menu button i{font-style:normal; font-size:20px; line-height:1}
#menu button small{font-size:11px; font-weight:400; color:var(--muted)}
#menu button:hover,#menu button:focus-visible{background:#ffe3cf; border-color:var(--orange)}
#menu .foot{grid-column:1/-1; font-size:11px; color:var(--muted); text-align:center; padding:2px 0 0}

/* 互动 */
#inter{width:300px; padding:0 10px 10px}
#inter .grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px}
#inter .grid button{all:unset; box-sizing:border-box; cursor:pointer; padding:8px 6px; border-radius:12px; font-size:13px; text-align:center; background:var(--soft); border:1.5px solid transparent}
#inter .grid button:hover{border-color:var(--orange-soft); background:#ffe9d9}
#inter .grid button[aria-pressed="true"]{background:#ffe3cf; border-color:var(--orange)}
#inter .grid button.wide{grid-column:span 3; background:var(--orange); color:#fff; font-weight:700}
#inter .grid button.wide:hover{background:var(--orange-deep)}
#inter .sep{grid-column:1/-1; font-size:11px; color:var(--muted); padding:4px 4px 0; letter-spacing:.08em}

/* 动作 */
#acts{width:320px; padding:0 10px 10px; display:flex; flex-direction:column; gap:8px}
#acts .tabs{display:flex; flex-wrap:wrap; gap:4px}
#acts .grid{display:grid; grid-template-columns:1fr 1fr; gap:4px; max-height:290px; overflow-y:auto}
#acts .grid button{all:unset; box-sizing:border-box; cursor:pointer; padding:7px 8px; border-radius:10px; font-size:13px; text-align:center}
#acts .grid button:hover,#acts .grid button:focus-visible{background:var(--soft)}
#acts .grid button.old{color:var(--muted)}
#acts .grid .empty{grid-column:1/-1; font-size:12px; color:var(--muted); text-align:center; padding:10px}
#acts .tip2{font-size:11px; color:var(--muted); text-align:center}

/* 聊天 */
#chat{z-index:11; width:360px; height:min(500px, calc(100vh - 40px)); border-radius:22px; display:flex; flex-direction:column; overflow:hidden; border-color:var(--line)}
.chat-head{display:flex; align-items:center; gap:10px; padding:10px 14px; background:linear-gradient(120deg,var(--orange),#f99a52); color:#fff}
.chat-head b{font-size:18px}
.chat-head .who{display:flex; flex-direction:column; line-height:1.2}
.chat-head .who span{font-size:11px; opacity:.92}
.chat-head .x{all:unset; cursor:pointer; margin-left:auto; width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:18px; background:rgba(255,255,255,.22)}
.chat-head .mini{all:unset; cursor:pointer; font-size:11px; padding:3px 8px; border-radius:999px; background:rgba(255,255,255,.22)}
#log{flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; user-select:text}
.msg{max-width:86%; padding:8px 12px; border-radius:16px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; position:relative}
.msg.me{align-self:flex-end; background:var(--orange); color:#fff; border-bottom-right-radius:4px}
.msg.her{align-self:flex-start; background:var(--soft); border-bottom-left-radius:4px}
.msg.err{align-self:flex-start; background:#fff1ee; border:1px solid #ffc6bc; color:#a3392a; font-size:13px}
.msg.sys{align-self:center; background:transparent; color:var(--muted); font-size:12px; text-align:center; padding:2px 8px}
.msg img.sticker{display:block; width:110px; border-radius:10px; margin-bottom:4px}
.msg .act{all:unset; cursor:pointer; margin:6px 6px 0 0; padding:3px 9px; border-radius:999px; font-size:12px; font-weight:700; background:#fff; border:1.5px solid var(--orange-soft); color:var(--orange-deep)}
.msg .act:hover{background:#ffe3cf}
.msg.live::after{content:"▍"; color:var(--orange); animation:blinkdot .8s infinite}
.chat-foot{display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); align-items:flex-end}
#q{flex:1; min-width:0; border:2px solid var(--line); border-radius:14px; padding:8px 12px; font:inherit; font-size:14px; background:#fff; color:var(--ink); outline:none; resize:none; max-height:110px; line-height:1.45}
#q:focus{border-color:var(--orange)}
#send{all:unset; cursor:pointer; background:var(--orange); color:#fff; border-radius:14px; padding:9px 16px; font-weight:700; font-size:14px}
#send[disabled]{opacity:.5}
#stop{all:unset; cursor:pointer; background:#fff; color:var(--orange-deep); border:2px solid var(--orange-soft); border-radius:14px; padding:7px 12px; font-weight:700; font-size:13px}
.chat-tools{display:flex; gap:6px; padding:0 12px 8px; font-size:11.5px; color:var(--muted); align-items:center}
.chat-tools a{color:var(--orange-deep); cursor:pointer}
.chat-tools .sp{flex:1}
#chat.compact{height:auto}
#chat.compact #log,#chat.compact .chat-tools{display:none}

/* 首次见面 */
#wizard{z-index:12; width:340px; padding:0 14px 12px; display:flex; flex-direction:column; gap:8px}
#wizard p{margin:0; font-size:13px; line-height:1.6}
#wizard label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted)}
#wizard input,#wizard select{border:1.5px solid var(--line); border-radius:10px; padding:7px 10px; font:inherit; font-size:13.5px; color:var(--ink); background:#fff; outline:none}
#wizard input:focus{border-color:var(--orange)}
#wizard .row{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
#wizard .geo{display:flex; flex-direction:column; gap:3px}
#wizard .geo button{all:unset; cursor:pointer; padding:6px 10px; border-radius:10px; background:var(--soft); font-size:12.5px}
#wizard .geo button:hover{background:#ffe3cf}
#wizard .steps{font-size:11px; color:var(--muted)}
#wizard .foot{display:flex; gap:6px; justify-content:flex-end; align-items:center}
#wizard .foot .skip{all:unset; cursor:pointer; color:var(--muted); font-size:12px; margin-right:auto; padding:4px}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important}}
</style>
</head>
<body>

<div id="pet" data-mode="idle" data-blush="" data-x="" tabindex="0" role="button" aria-label="桌宠">
  <div class="ground"></div>
  <div class="stage">
    <div class="sq" id="sq">
      <div class="frames" id="frames"><canvas id="stage" aria-hidden="true"></canvas></div>
      <div class="zzz" id="zzz">Z<small>z</small><small>z</small></div>
      <div class="think"><i></i><i></i><i></i></div>
      <svg id="ov" aria-hidden="true">
        <defs><filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>
        <g class="ov ov-blush" id="ovBlush"></g>
        <g class="ov ov-stain" id="ovStain"></g>
        <g class="ov ov-anger" id="ovAnger"><g stroke="#e23b3b" stroke-width="7" stroke-linecap="round" fill="none">
          <path d="M-20 -6 Q-6 -6 -6 -20"/><path d="M6 -20 Q6 -6 20 -6"/><path d="M20 6 Q6 6 6 20"/><path d="M-6 20 Q-6 6 -20 6"/></g></g>
        <path class="ov ov-sweat" id="ovSweat" d="M0 0 Q-16 30 0 41 Q16 30 0 0Z" fill="#cfeaff" stroke="#7cb7e3" stroke-width="3"/>
        <g class="ov ov-tears" id="ovTears" fill="#bfe3ff" stroke="#7cb7e3" stroke-width="2.5"></g>
        <g class="ov ov-stars" id="ovStars"><g fill="#ffbe3d" stroke="#e59a12" stroke-width="2">
          <path d="M-130 0 l7 -16 l7 16 l-7 16Z"/><path d="M123 0 l7 -16 l7 16 l-7 16Z"/><path d="M-7 -60 l7 -16 l7 16 l-7 16Z"/></g></g>
        <g class="ov ov-fire" id="ovFire"><text font-size="54" text-anchor="middle">🔥</text></g>
        <g class="ov ov-spicy" id="ovSpicy"><text font-size="40" font-weight="900" fill="#e2462f" stroke="#fff" stroke-width="6" paint-order="stroke" text-anchor="middle">辣!</text></g>
        <g class="ov ov-steam" id="ovSteam" stroke="#d8c4b6" stroke-linecap="round" fill="none" stroke-width="7" opacity=".8"></g>
        <g class="ov ov-shuttle" id="ovShuttle"><g id="shuttle"><g transform="scale(3)">
          <path d="M-3 3 L-7 -9 L7 -9 L3 3Z" fill="#fff" stroke="#bdb3ad" stroke-width=".7"/>
          <path d="M-1 3 L-3 -9 M1 3 L3 -9 M-6 -5 L6 -5" stroke="#cfc6c0" stroke-width=".6"/>
          <circle cx="0" cy="6" r="3.6" fill="#f2762f"/></g></g></g>
        <circle class="ov ov-snot snot" id="ovSnot" r="13" fill="#d7f0ff" stroke="#9cd0f0" stroke-width="3" opacity=".85"/>
        <g id="flash" opacity="0"><path d="M0 0 L30 -14 L22 0 L40 3 L22 7 L30 18Z" fill="#ffd36a"/><circle cx="6" cy="2" r="8" fill="#fff4c2"/></g>
        <circle id="muzzle" r="1" fill="none"/>
      </svg>
    </div>
  </div>
</div>

<div id="bubble" hidden></div>
<div id="tip" class="tip" hidden>小克</div>

<!-- 主面板 -->
<div id="menu" class="panel" hidden role="menu">
  <button role="menuitem" data-cmd="chat"><i>💬</i>聊天<small>和她说说话</small></button>
  <button role="menuitem" data-cmd="inter"><i>🤝</i>互动<small>摸摸、抱抱、一起玩</small></button>
  <button role="menuitem" data-cmd="acts"><i>🎭</i>动作<small>让她做个动作</small></button>
  <button role="menuitem" data-cmd="settings"><i>⚙️</i>设置<small>模型、陪伴、资料…</small></button>
  <div class="foot" id="menuFoot">单击她互动 · 按住拖动 · Ctrl+滚轮调大小</div>
</div>

<!-- 互动 -->
<div id="inter" class="panel" hidden role="menu" aria-label="互动">
  <div class="head"><b>互动</b><span class="sub" id="interSub"></span><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="grid" id="interGrid"></div>
</div>

<!-- 动作 -->
<div id="acts" class="panel" hidden role="menu" aria-label="动作">
  <div class="head"><b>动作</b><span class="sub" id="actsSub"></span><button class="x" data-close aria-label="关闭">×</button></div>
  <div class="tabs" id="actTabs"></div>
  <div class="grid" id="actGrid"></div>
  <div class="tip2">灰色的是图还没画好的动作 · 不选的时候她会按时间、天气和节日自己挑</div>
</div>

<!-- 聊天 -->
<div id="chat" class="panel" hidden role="dialog" aria-label="聊天">
  <div class="chat-head"><div class="who"><b id="chatName">小克</b><span id="status">读取中…</span></div><button class="mini" id="compactBtn" title="收起对话记录，只留输入框">收起</button><button class="x" id="close" aria-label="关闭聊天">×</button></div>
  <div id="log"></div>
  <form class="chat-foot" id="form">
    <textarea id="q" rows="1" maxlength="2000" placeholder="跟她说点什么…（回车发送，Shift+回车换行）"></textarea>
    <button id="stop" type="button" hidden>停止</button>
    <button id="send" type="submit">发送</button>
  </form>
  <div class="chat-tools"><a id="clearChat">清空记录</a><span>·</span><a id="chatSettings">模型设置</a><span class="sp"></span><span id="chatHint"></span></div>
</div>

<!-- 首次见面 -->
<div id="wizard" class="panel" hidden role="dialog" aria-label="初次见面">
  <div class="head"><b id="wizTitle">初次见面</b><span class="steps" id="wizSteps"></span><button class="x" id="wizClose" aria-label="关闭">×</button></div>
  <div id="wizBody"></div>
  <div class="foot"><button class="skip" id="wizSkip">以后再说</button><button class="btn ghost" id="wizBack" hidden>上一步</button><button class="btn" id="wizNext">下一步</button></div>
</div>

<script src="festivals.js"></script>
<script src="physics.js"></script>
<script src="motion.js"></script>
<script src="app.js"></script>
</body></html>
